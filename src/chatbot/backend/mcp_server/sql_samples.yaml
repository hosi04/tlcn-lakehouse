samples:

  - id: "revenue_by_month"
    question: "Tổng doanh thu theo từng tháng"
    tables: ["fact_order", "dim_date"]
    sql: |
      SELECT
          d.year,
          d.month,
          d.month_name,
          SUM(fo.total_payment_value) AS total_revenue,
          COUNT(fo.order_key) AS total_orders
      FROM iceberg.gold.fact_order fo
      JOIN iceberg.gold.dim_date d ON fo.purchase_date_key = d.date_key
      WHERE fo.order_status = 'delivered'
      GROUP BY d.year, d.month, d.month_name
      ORDER BY d.year, d.month

  - id: "revenue_by_quarter"
    question: "Doanh thu theo quý"
    tables: ["fact_order", "dim_date"]
    sql: |
      SELECT
          d.year,
          d.quarter,
          SUM(fo.total_payment_value) AS total_revenue,
          COUNT(fo.order_key) AS total_orders
      FROM iceberg.gold.fact_order fo
      JOIN iceberg.gold.dim_date d ON fo.purchase_date_key = d.date_key
      GROUP BY d.year, d.quarter
      ORDER BY d.year, d.quarter

  - id: "revenue_by_year"
    question: "Tổng doanh thu theo năm"
    tables: ["fact_order", "dim_date"]
    sql: |
      SELECT
          d.year,
          SUM(fo.total_payment_value) AS total_revenue,
          COUNT(fo.order_key) AS total_orders,
          AVG(fo.total_payment_value) AS avg_order_value
      FROM iceberg.gold.fact_order fo
      JOIN iceberg.gold.dim_date d ON fo.purchase_date_key = d.date_key
      GROUP BY d.year
      ORDER BY d.year

  - id: "total_revenue_all_time"
    question: "Tổng doanh thu toàn bộ hệ thống"
    tables: ["fact_order"]
    sql: |
      SELECT
          SUM(total_payment_value) AS total_revenue
      FROM iceberg.gold.fact_order
      WHERE order_status = 'delivered'

  - id: "total_orders_count"
    question: "Tổng số đơn hàng đã giao thành công"
    tables: ["fact_order"]
    sql: |
      SELECT
          COUNT(order_key) AS total_delivered_orders
      FROM iceberg.gold.fact_order
      WHERE order_status = 'delivered'

  - id: "top_product_categories_by_revenue"
    question: "Top 10 danh mục sản phẩm có doanh thu cao nhất"
    tables: ["fact_order_item", "dim_product"]
    sql: |
      SELECT
          dp.product_category_name_english AS category,
          SUM(foi.item_total_value) AS total_revenue,
          COUNT(foi.order_item_key) AS total_items_sold
      FROM iceberg.gold.fact_order_item foi
      JOIN iceberg.gold.dim_product dp ON foi.product_key = dp.product_key
      WHERE foi.order_status = 'delivered'
      GROUP BY dp.product_category_name_english
      ORDER BY total_revenue DESC
      LIMIT 10

  - id: "top_product_categories_by_quantity"
    question: "Top 10 danh mục sản phẩm bán chạy nhất theo số lượng"
    tables: ["fact_order_item", "dim_product"]
    sql: |
      SELECT
          dp.product_category_name_english AS category,
          COUNT(foi.order_item_key) AS total_items_sold,
          SUM(foi.item_total_value) AS total_revenue
      FROM iceberg.gold.fact_order_item foi
      JOIN iceberg.gold.dim_product dp ON foi.product_key = dp.product_key
      GROUP BY dp.product_category_name_english
      ORDER BY total_items_sold DESC
      LIMIT 10

  - id: "revenue_by_category_by_month"
    question: "Doanh thu theo danh mục sản phẩm theo từng tháng"
    tables: ["fact_order_item", "dim_product", "dim_date"]
    sql: |
      SELECT
          d.year,
          d.month,
          dp.product_category_name_english AS category,
          SUM(foi.item_total_value) AS total_revenue
      FROM iceberg.gold.fact_order_item foi
      JOIN iceberg.gold.dim_product dp ON foi.product_key = dp.product_key
      JOIN iceberg.gold.dim_date d ON foi.purchase_date_key = d.date_key
      GROUP BY d.year, d.month, dp.product_category_name_english
      ORDER BY d.year, d.month, total_revenue DESC

  - id: "top_sellers_by_revenue"
    question: "Top 10 seller có doanh thu cao nhất"
    tables: ["fact_order_item", "dim_seller"]
    sql: |
      SELECT
          ds.seller_id,
          ds.seller_city,
          ds.seller_state,
          SUM(foi.item_total_value) AS total_revenue,
          COUNT(DISTINCT foi.order_id) AS total_orders
      FROM iceberg.gold.fact_order_item foi
      JOIN iceberg.gold.dim_seller ds ON foi.seller_key = ds.seller_key
      WHERE foi.order_status = 'delivered'
      GROUP BY ds.seller_id, ds.seller_city, ds.seller_state
      ORDER BY total_revenue DESC
      LIMIT 10

  - id: "revenue_by_seller_state"
    question: "Doanh thu theo tiểu bang của seller"
    tables: ["fact_order_item", "dim_seller"]
    sql: |
      SELECT
          ds.seller_state,
          SUM(foi.item_total_value) AS total_revenue,
          COUNT(DISTINCT foi.order_id) AS total_orders,
          COUNT(DISTINCT ds.seller_key) AS total_sellers
      FROM iceberg.gold.fact_order_item foi
      JOIN iceberg.gold.dim_seller ds ON foi.seller_key = ds.seller_key
      GROUP BY ds.seller_state
      ORDER BY total_revenue DESC

  - id: "orders_by_customer_state"
    question: "Số đơn hàng theo tiểu bang của khách hàng"
    tables: ["fact_order", "dim_customer"]
    sql: |
      SELECT
          dc.customer_state,
          COUNT(fo.order_key) AS total_orders,
          SUM(fo.total_payment_value) AS total_revenue
      FROM iceberg.gold.fact_order fo
      JOIN iceberg.gold.dim_customer dc ON fo.customer_key = dc.customer_key
      GROUP BY dc.customer_state
      ORDER BY total_orders DESC

  - id: "top_customers_by_spending"
    question: "Top 10 khách hàng chi tiêu nhiều nhất"
    tables: ["fact_order", "dim_customer"]
    sql: |
      SELECT
          dc.customer_unique_id,
          dc.customer_city,
          dc.customer_state,
          COUNT(fo.order_key) AS total_orders,
          SUM(fo.total_payment_value) AS total_spending
      FROM iceberg.gold.fact_order fo
      JOIN iceberg.gold.dim_customer dc ON fo.customer_key = dc.customer_key
      WHERE fo.order_status = 'delivered'
      GROUP BY dc.customer_unique_id, dc.customer_city, dc.customer_state
      ORDER BY total_spending DESC
      LIMIT 10

  - id: "payment_method_distribution"
    question: "Phân phối phương thức thanh toán"
    tables: ["fact_order"]
    sql: |
      SELECT
          primary_payment_type,
          COUNT(order_key) AS total_orders,
          SUM(total_payment_value) AS total_value,
          ROUND(COUNT(order_key) * 100.0 / SUM(COUNT(order_key)) OVER (), 2) AS percentage
      FROM iceberg.gold.fact_order
      GROUP BY primary_payment_type
      ORDER BY total_orders DESC

  - id: "order_status_distribution"
    question: "Phân phối trạng thái đơn hàng"
    tables: ["fact_order"]
    sql: |
      SELECT
          order_status,
          COUNT(order_key) AS total_orders,
          ROUND(COUNT(order_key) * 100.0 / SUM(COUNT(order_key)) OVER (), 2) AS percentage
      FROM iceberg.gold.fact_order
      GROUP BY order_status
      ORDER BY total_orders DESC

  - id: "avg_delivery_time_by_month"
    question: "Thời gian giao hàng trung bình theo tháng"
    tables: ["fact_order", "dim_date"]
    sql: |
      SELECT
          d.year,
          d.month,
          d.month_name,
          ROUND(AVG(fo.delivery_actual_days), 2) AS avg_delivery_days,
          ROUND(AVG(fo.delivery_estimate_days), 2) AS avg_estimate_days,
          ROUND(AVG(fo.delivery_early_days), 2) AS avg_early_days
      FROM iceberg.gold.fact_order fo
      JOIN iceberg.gold.dim_date d ON fo.purchase_date_key = d.date_key
      WHERE fo.order_status = 'delivered'
        AND fo.delivery_actual_days IS NOT NULL
      GROUP BY d.year, d.month, d.month_name
      ORDER BY d.year, d.month

  - id: "late_deliveries_by_state"
    question: "Số đơn giao trễ theo tiểu bang"
    tables: ["fact_order", "dim_customer"]
    sql: |
      SELECT
          dc.customer_state,
          COUNT(fo.order_key) AS late_orders,
          ROUND(AVG(fo.delivery_early_days), 2) AS avg_days_late
      FROM iceberg.gold.fact_order fo
      JOIN iceberg.gold.dim_customer dc ON fo.customer_key = dc.customer_key
      WHERE fo.order_status = 'delivered'
        AND fo.delivery_early_days < 0
      GROUP BY dc.customer_state
      ORDER BY late_orders DESC

  - id: "avg_order_value_by_payment"
    question: "Giá trị đơn hàng trung bình theo phương thức thanh toán"
    tables: ["fact_order"]
    sql: |
      SELECT
          primary_payment_type,
          ROUND(AVG(total_payment_value), 2) AS avg_order_value,
          ROUND(AVG(number_of_items), 2) AS avg_items_per_order,
          COUNT(order_key) AS total_orders
      FROM iceberg.gold.fact_order
      WHERE order_status = 'delivered'
      GROUP BY primary_payment_type
      ORDER BY avg_order_value DESC

  - id: "weekend_vs_weekday_orders"
    question: "So sánh đơn hàng ngày thường và cuối tuần"
    tables: ["fact_order", "dim_date"]
    sql: |
      SELECT
          CASE WHEN d.is_weekend = TRUE THEN 'Cuối tuần' ELSE 'Ngày thường' END AS day_type,
          COUNT(fo.order_key) AS total_orders,
          SUM(fo.total_payment_value) AS total_revenue,
          ROUND(AVG(fo.total_payment_value), 2) AS avg_order_value
      FROM iceberg.gold.fact_order fo
      JOIN iceberg.gold.dim_date d ON fo.purchase_date_key = d.date_key
      GROUP BY d.is_weekend
      ORDER BY total_orders DESC

  - id: "freight_cost_by_category"
    question: "Phí vận chuyển trung bình theo danh mục sản phẩm"
    tables: ["fact_order_item", "dim_product"]
    sql: |
      SELECT
          dp.product_category_name_english AS category,
          ROUND(AVG(foi.item_freight_value), 2) AS avg_freight,
          ROUND(AVG(foi.item_price), 2) AS avg_price,
          COUNT(foi.order_item_key) AS total_items
      FROM iceberg.gold.fact_order_item foi
      JOIN iceberg.gold.dim_product dp ON foi.product_key = dp.product_key
      GROUP BY dp.product_category_name_english
      ORDER BY avg_freight DESC
      LIMIT 15

  - id: "late_order_rate_by_customer_state_2018"
    question: "Tỷ lệ đơn hàng giao trễ theo từng tiểu bang của khách hàng trong năm 2018"
    tables: ["fact_order", "dim_customer", "dim_date"]
    sql: |
      SELECT
          dc.customer_state,
          COUNT(fo.order_key) AS total_orders,
          SUM(CASE WHEN fo.delivery_early_days < 0 THEN 1 ELSE 0 END) AS late_orders,
          ROUND(
              SUM(CASE WHEN fo.delivery_early_days < 0 THEN 1 ELSE 0 END) * 100.0
              / COUNT(fo.order_key),
              2
          ) AS late_rate_pct
      FROM iceberg.gold.fact_order fo
      JOIN iceberg.gold.dim_customer dc ON fo.customer_key = dc.customer_key
      JOIN iceberg.gold.dim_date d ON fo.purchase_date_key = d.date_key
      WHERE d.year = 2018
        AND fo.order_status = 'delivered'
      GROUP BY dc.customer_state
      ORDER BY late_rate_pct DESC

  - id: "top_categories_revenue_sao_paulo_customers"
    question: "Top danh mục sản phẩm có doanh thu cao nhất từ khách hàng ở sao paulo"
    tables: ["fact_order_item", "dim_product", "dim_customer"]
    sql: |
      SELECT
          dp.product_category_name_english AS category,
          SUM(foi.item_total_value) AS total_revenue,
          COUNT(foi.order_item_key) AS total_items
      FROM iceberg.gold.fact_order_item foi
      JOIN iceberg.gold.dim_product dp ON foi.product_key = dp.product_key
      JOIN iceberg.gold.dim_customer dc ON foi.customer_key = dc.customer_key
      WHERE LOWER(dc.customer_city) = 'sao paulo'
        AND foi.order_status = 'delivered'
      GROUP BY dp.product_category_name_english
      ORDER BY total_revenue DESC
      LIMIT 10

  - id: "fastest_sellers_min_50_items"
    question: "Top seller có thời gian giao hàng trung bình nhanh nhất với tối thiểu 50 item"
    tables: ["fact_order_item", "dim_seller"]
    sql: |
      SELECT
          ds.seller_id,
          ds.seller_city,
          ds.seller_state,
          ROUND(AVG(foi.shipping_days), 2) AS avg_shipping_days,
          COUNT(foi.order_item_key) AS total_items
      FROM iceberg.gold.fact_order_item foi
      JOIN iceberg.gold.dim_seller ds ON foi.seller_key = ds.seller_key
      WHERE foi.order_status = 'delivered'
        AND foi.shipping_days IS NOT NULL
      GROUP BY ds.seller_id, ds.seller_city, ds.seller_state
      HAVING COUNT(foi.order_item_key) >= 50
      ORDER BY avg_shipping_days ASC
      LIMIT 5

  - id: "credit_card_installment_rate"
    question: "Tỷ lệ đơn hàng thanh toán bằng credit_card và có tổng số kỳ trả góp từ 6 trở lên"
    tables: ["fact_order"]
    sql: |
      SELECT
          COUNT(order_key) AS total_orders,
          SUM(
              CASE
                  WHEN primary_payment_type = 'credit_card'
                   AND total_installments >= 6
                  THEN 1 ELSE 0
              END
          ) AS matched_orders,
          ROUND(
              SUM(
                  CASE
                      WHEN primary_payment_type = 'credit_card'
                       AND total_installments >= 6
                      THEN 1 ELSE 0
                  END
              ) * 100.0 / COUNT(order_key),
              2
          ) AS matched_rate_pct
      FROM iceberg.gold.fact_order

  - id: "customer_most_distinct_products"
    question: "Khách hàng mua nhiều sản phẩm khác nhau nhất"
    tables: ["fact_order_item", "dim_customer"]
    sql: |
      SELECT
          dc.customer_unique_id,
          dc.customer_city,
          dc.customer_state,
          COUNT(DISTINCT foi.product_key) AS distinct_products,
          COUNT(foi.order_item_key) AS total_items
      FROM iceberg.gold.fact_order_item foi
      JOIN iceberg.gold.dim_customer dc ON foi.customer_key = dc.customer_key
      WHERE foi.order_status = 'delivered'
      GROUP BY dc.customer_unique_id, dc.customer_city, dc.customer_state
      ORDER BY distinct_products DESC, total_items DESC
      LIMIT 1

  - id: "yearly_avg_items_and_order_value"
    question: "Theo từng năm trung bình mỗi đơn hàng có bao nhiêu item và giá trị thanh toán trung bình"
    tables: ["fact_order", "dim_date"]
    sql: |
      SELECT
          d.year,
          ROUND(AVG(fo.number_of_items), 2) AS avg_items_per_order,
          ROUND(AVG(fo.total_payment_value), 2) AS avg_order_value,
          COUNT(fo.order_key) AS total_orders
      FROM iceberg.gold.fact_order fo
      JOIN iceberg.gold.dim_date d ON fo.purchase_date_key = d.date_key
      GROUP BY d.year
      ORDER BY d.year

  - id: "voucher_rate_by_month"
    question: "Tháng có tỷ lệ đơn hàng thanh toán bằng voucher cao nhất"
    tables: ["fact_order", "dim_date"]
    sql: |
      SELECT
          d.month,
          COUNT(fo.order_key) AS total_orders,
          SUM(CASE WHEN fo.primary_payment_type = 'voucher' THEN 1 ELSE 0 END) AS voucher_orders,
          ROUND(
              SUM(CASE WHEN fo.primary_payment_type = 'voucher' THEN 1 ELSE 0 END) * 100.0
              / COUNT(fo.order_key),
              2
          ) AS voucher_rate_pct
      FROM iceberg.gold.fact_order fo
      JOIN iceberg.gold.dim_date d ON fo.purchase_date_key = d.date_key
      GROUP BY d.month
      ORDER BY voucher_rate_pct DESC
      LIMIT 1

  - id: "customer_seller_city_gap"
    question: "Thành phố có chênh lệch lớn nhất giữa số lượng khách hàng và số lượng seller"
    tables: ["dim_customer", "dim_seller"]
    sql: |
      WITH customer_counts AS (
          SELECT
              customer_city AS city,
              COUNT(customer_key) AS total_customers
          FROM iceberg.gold.dim_customer
          GROUP BY customer_city
      ),
      seller_counts AS (
          SELECT
              seller_city AS city,
              COUNT(seller_key) AS total_sellers
          FROM iceberg.gold.dim_seller
          GROUP BY seller_city
      )
      SELECT
          COALESCE(c.city, s.city) AS city,
          COALESCE(c.total_customers, 0) AS total_customers,
          COALESCE(s.total_sellers, 0) AS total_sellers,
          ABS(COALESCE(c.total_customers, 0) - COALESCE(s.total_sellers, 0)) AS absolute_gap
      FROM customer_counts c
      FULL OUTER JOIN seller_counts s ON c.city = s.city
      ORDER BY absolute_gap DESC
      LIMIT 1

  - id: "weekend_top_categories_by_revenue"
    question: "Cuối tuần top danh mục sản phẩm có doanh thu item cao nhất"
    tables: ["fact_order_item", "dim_product", "dim_date"]
    sql: |
      SELECT
          dp.product_category_name_english AS category,
          SUM(foi.item_total_value) AS total_revenue,
          COUNT(foi.order_item_key) AS total_items
      FROM iceberg.gold.fact_order_item foi
      JOIN iceberg.gold.dim_product dp ON foi.product_key = dp.product_key
      JOIN iceberg.gold.dim_date d ON foi.purchase_date_key = d.date_key
      WHERE d.is_weekend = TRUE
        AND foi.order_status = 'delivered'
      GROUP BY dp.product_category_name_english
      ORDER BY total_revenue DESC
      LIMIT 3

  - id: "seller_city_item_count"
    question: "Thành phố của seller có nhiều item bán ra nhất"
    tables: ["fact_order_item", "dim_seller"]
    sql: |
      SELECT
          ds.seller_city AS city,
          COUNT(foi.order_item_key) AS total_items_sold
      FROM iceberg.gold.fact_order_item foi
      JOIN iceberg.gold.dim_seller ds ON foi.seller_key = ds.seller_key
      GROUP BY ds.seller_city
      ORDER BY total_items_sold DESC
      LIMIT 10

  - id: "count_items_by_month_int"
    question: "Số lượng item bán ra trong tháng 11 năm 2017"
    tables: ["fact_order_item", "dim_date"]
    sql: |
      SELECT
          COUNT(foi.order_item_key) AS total_items_sold
      FROM iceberg.gold.fact_order_item foi
      JOIN iceberg.gold.dim_date d ON foi.purchase_date_key = d.date_key
      WHERE d.year = 2017
        AND d.month = 11 -- Lưu ý: tháng lưu dưới dạng số int, KHÔNG dùng string như 'November'
        
  - id: "ratio_freight_over_20_percent"
    question: "Phần trăm doanh thu từ đơn hàng có phí ship chiếm hơn 20% tổng giá trị đơn"
    tables: ["fact_order"]
    sql: |
      SELECT
          SUM(total_payment_value) AS total_revenue,
          SUM(CASE WHEN total_freight_value > 0.2 * total_payment_value THEN total_payment_value ELSE 0 END) AS high_freight_revenue,
          ROUND(
              SUM(CASE WHEN total_freight_value > 0.2 * total_payment_value THEN total_payment_value ELSE 0 END) * 100.0
              / NULLIF(SUM(total_payment_value), 0),
              2
          ) AS high_freight_revenue_pct
      FROM iceberg.gold.fact_order

  - id: "yoy_revenue_comparison_by_state"
    question: "So sánh tổng doanh thu theo từng tiểu bang giữa năm 2017 và 2018"
    tables: ["fact_order", "dim_customer", "dim_date"]
    sql: |
      SELECT
          dc.customer_state,
          SUM(CASE WHEN d.year = 2017 THEN fo.total_payment_value ELSE 0 END) AS revenue_2017,
          SUM(CASE WHEN d.year = 2018 THEN fo.total_payment_value ELSE 0 END) AS revenue_2018
      FROM iceberg.gold.fact_order fo
      JOIN iceberg.gold.dim_customer dc ON fo.customer_key = dc.customer_key
      JOIN iceberg.gold.dim_date d ON fo.purchase_date_key = d.date_key
      WHERE d.year IN (2017, 2018)
      GROUP BY dc.customer_state
      ORDER BY revenue_2018 DESC

  - id: "trino_group_by_alias_rule"
    question: "Phân loại khách hàng theo tổng chi tiêu và đếm số lượng đơn hàng"
    tables: ["fact_order"]
    sql: |
      SELECT 
          CASE 
              WHEN total_payment_value < 100 THEN 'Under 100'
              WHEN total_payment_value BETWEEN 100 AND 500 THEN '100-500'
              ELSE 'Above 500'
          END AS customer_segment,
          COUNT(order_key) AS order_count
      FROM iceberg.gold.fact_order
      -- LƯU Ý QUAN TRỌNG: Trino KHÔNG hỗ trợ GROUP BY bằng Alias.
      -- BẮT BUỘC dùng GROUP BY số thứ tự (ví dụ: GROUP BY 1) hoặc lặp lại nguyên cụm CASE.
      GROUP BY 1
      ORDER BY 1

  - id: "repeat_customers_rate"
    question: "Tỷ lệ khách hàng mua hàng lặp lại (mua từ 2 đơn trở lên) theo từng tiểu bang"
    tables: ["fact_order", "dim_customer"]
    sql: |
      WITH customer_order_counts AS (
          SELECT
              dc.customer_state,
              dc.customer_unique_id,
              COUNT(fo.order_key) AS total_orders_per_customer
          FROM iceberg.gold.fact_order fo
          JOIN iceberg.gold.dim_customer dc ON fo.customer_key = dc.customer_key
          GROUP BY dc.customer_state, dc.customer_unique_id
      )
      SELECT
          customer_state,
          COUNT(customer_unique_id) AS total_customers,
          SUM(CASE WHEN total_orders_per_customer >= 2 THEN 1 ELSE 0 END) AS repeat_customers,
          ROUND(SUM(CASE WHEN total_orders_per_customer >= 2 THEN 1 ELSE 0 END) * 100.0 / COUNT(customer_unique_id), 2) AS repeat_rate_pct
      FROM customer_order_counts
      GROUP BY customer_state
      ORDER BY repeat_rate_pct DESC

  - id: "growth_rate_nullif"
    question: "Tỷ lệ tăng trưởng doanh thu so với năm trước"
    tables: ["fact_order", "dim_date"]
    sql: |
      SELECT
          SUM(CASE WHEN d.year = 2018 THEN fo.total_payment_value ELSE 0 END) AS revenue_2018,
          SUM(CASE WHEN d.year = 2017 THEN fo.total_payment_value ELSE 0 END) AS revenue_2017,
          -- BẮT BUỘC dùng NULLIF(mẫu_số, 0) để tránh lỗi Division by Zero
          (SUM(CASE WHEN d.year = 2018 THEN fo.total_payment_value ELSE 0 END) - SUM(CASE WHEN d.year = 2017 THEN fo.total_payment_value ELSE 0 END))
          / NULLIF(SUM(CASE WHEN d.year = 2017 THEN fo.total_payment_value ELSE 0 END), 0) * 100.0 AS growth_rate_pct
      FROM iceberg.gold.fact_order fo
      JOIN iceberg.gold.dim_date d ON fo.purchase_date_key = d.date_key
      WHERE d.year IN (2017, 2018)
